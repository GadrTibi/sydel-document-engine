[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "sydel-document-engine"
version = "0.1.0"
description = "Deterministic legal document generation engine for DAAT x SYDEL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
  "python-docx>=1.1,<2",
  "PyYAML>=6.0,<7",
  "streamlit>=1.45,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<4",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
]

[tool.poetry]
packages = [
  { include = "sydel_doc_engine", from = "src" },
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_configs = true
strict = true
packages = ["sydel_doc_engine"]

[tool.hatch.build.targets.wheel]
packages = ["src/sydel_doc_engine"]
